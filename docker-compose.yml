services:
  photoboth:
    build: .
    image: photoboth:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      # Initial admin PIN, only used the very first time the app boots
      # (change it from the /admin settings page afterwards).
      ADMIN_PIN: "1234"
      # Optional: set this if the booth is reached via a LAN hostname/IP
      # other than localhost, so QR codes point somewhere scannable.
      # BASE_URL: "http://photobooth.local:8080"
      # Optional: serve HTTPS instead of HTTP. Required if the kiosk browser
      # will open the app from anything other than localhost/127.0.0.1 —
      # browsers only allow camera access (getUserMedia) from a secure
      # context. See README.md "Enabling HTTPS" for how to generate a cert.
      # TLS_CERT_FILE: "/certs/cert.pem"
      # TLS_KEY_FILE: "/certs/key.pem"
    volumes:
      - photoboth-data:/data
      # - ./certs:/certs:ro
    restart: unless-stopped

volumes:
  photoboth-data:
